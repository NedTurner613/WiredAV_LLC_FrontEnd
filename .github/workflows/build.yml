name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: wire-av-app
      run: npm install
    - name: Build app
      working-directory: wire-av-app
      run: npm run build --if-present
    - name: Lint app
      working-directory: wire-av-app
      run: npm run lint --if-present